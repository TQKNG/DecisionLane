 " href="activity.html"><svg class="icon " width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h5l3-8 4 16 3-8h5"/></svg><span class="label">Activity</span></a><a class="nav-row  active" href="settings.html"><svg class="icon " width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="label">Settings</span></a><div class="user"><span class="avatar">KN</span><span>Khanh Nguyen</span></div></div></aside><div class="right"><header class="topbar"><label class="global-search"><svg class="icon " width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 5 5"/></svg><input type="search" placeholder="Search across DecisionLane" aria-label="Search across DecisionLane"></label><button class="bell" aria-label="Notifications" data-toast="No new notifications in this preview."><svg class="icon " width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/></svg></button></header><main class="content"><div class="crumbs"><b>Settings</b></div><div class="page-head"><div><h1>Settings</h1><p>Manage your DecisionLane workspace preferences.</p></div></div><section class="card card-pad" style="max-width:760px"><h2>Settings</h2><div class="file-row">Signed in as Khanh Nguyen<span class="spacer"></span><span class="muted">Workspace member</span></div></section></main></div></div><div class="toast" role="status" aria-live="polite"></div><script>
document.addEventListener('DOMContentLoaded',()=>{
  const toast=document.querySelector('.toast');
  function showToast(message){if(!toast)return;toast.textContent=message;toast.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>toast.classList.remove('show'),3300)}
  document.querySelectorAll('[data-toast]').forEach(button=>button.addEventListener('click',()=>showToast(button.dataset.toast)));
  document.querySelectorAll('[data-confirm-delete]').forEach(button=>button.addEventListener('click',()=>{if(confirm('Delete this draft claim?')){button.closest('tr')?.remove();showToast('Draft removed from this preview.')}}));
  const claimSearch=document.querySelector('#claimSearch');if(claimSearch){claimSearch.addEventListener('input',()=>{const query=claimSearch.value.trim().toLowerCase();document.querySelectorAll('.claim-item').forEach(item=>item.hidden=!item.textContent.toLowerCase().includes(query))})}
  const tableSearch=document.querySelector('#tableSearch');if(tableSearch){tableSearch.addEventListener('input',()=>{const query=tableSearch.value.trim().toLowerCase();document.querySelectorAll('tbody tr').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(query))})}
  const upload=document.querySelector('#evidenceUpload');if(upload){upload.addEventListener('change',()=>{const list=document.querySelector('#uploadList');for(const file of upload.files){const row=document.createElement('div');row.className='file-row';row.innerHTML='<span aria-hidden="true">📄</span><strong></strong><span class="spacer"></span><span class="pill-tag tag-green">Ready</span>';row.querySelector('strong').textContent=file.name;list.appendChild(row)}showToast('Files added to this preview.')})}
  const claimForm=document.querySelector('#claimForm');if(claimForm){claimForm.addEventListener('submit',event=>{event.preventDefault();showToast('Claim submitted in this front-end preview.')});document.querySelector('#saveDraft')?.addEventListener('click',()=>{const data=Object.fromEntries(new FormData(claimForm).entries());localStorage.setItem('decisionLaneDraft',JSON.stringify(data));showToast('Draft saved in this browser.')});try{const saved=JSON.parse(localStorage.getItem('decisionLaneDraft')||'null');if(saved)for(const [name,value] of Object.entries(saved)){const input=claimForm.elements.namedItem(name);if(input&&typeof value==='string')input.value=value}}catch{}}
  const login=document.querySelector('#loginForm');if(login){login.addEventListener('submit',event=>{event.preventDefault();location.href='loading.html?next=dashboard.html'})}
  if(document.body.dataset.page==='loading'){const next=new URLSearchParams(location.search).get('next');if(next&&/^[a-z0-9-]+\.html$/i.test(next))setTimeout(()=>location.href=next,2600)}
});
</script></body></html>
