name: Deploy development infrastructure

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: refundflow-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Validate infrastructure template
        run: az bicep build --file infra/main.bicep
      - name: Read currently deployed API image
        run: |
          CURRENT_IMAGE=$(az containerapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name refundflow-dev-api \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          echo "CURRENT_IMAGE=${CURRENT_IMAGE}" >> "$GITHUB_ENV"
      - name: Deploy infrastructure
        run: |
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters infra/dev.bicepparam \
            --parameters apiImage="${CURRENT_IMAGE}" \
            --name "refundflow-infra-${GITHUB_SHA::7}"
