name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        working-directory: backend
        run: python -m pip install --pre -e '.[dev]'
      - name: Lint
        working-directory: backend
        run: ruff check .
      - name: Type check
        working-directory: backend
        run: mypy src api
      - name: Verify OpenAPI artifact
        working-directory: backend
        run: python -m scripts.export_openapi --check
      - name: Unit and integration tests
        working-directory: backend
        run: pytest --cov=refundflow --cov-report=term-missing --cov-fail-under=80
      - name: Dataset gates
        run: PYTHONPATH=backend/src python evals/run_local_gates.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm lint
        working-directory: frontend
      - run: pnpm typecheck
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
        env:
          NEXT_PUBLIC_ENTRA_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          NEXT_PUBLIC_ENTRA_CLIENT_ID: ${{ vars.SPA_CLIENT_ID }}
          NEXT_PUBLIC_API_SCOPE: api://${{ vars.API_CLIENT_ID }}/access_as_user
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL }}

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: az bicep build --file infra/main.bicep
